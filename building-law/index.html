<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Title（加關鍵字） -->
    <title>建築法規查詢整理｜改建、增建、違建、建造執照一次看｜LUMArch</title>

    <!-- SEO Description（寫給人點的） -->
    <meta
      name="description"
      content="快速查詢台灣建築法規，整理改建申請、增建合法性、違建處理與建造執照流程，附條文來源與重點解釋。"
    />

    <!-- SEO Keywords（輔助） -->
    <meta
      name="keywords"
      content="建築法規,改建申請,增建合法,違建罰款,建造執照,使用執照,台灣建築法"
    />

    <!-- Open Graph（分享用） -->
    <meta property="og:title" content="建築法規查詢整理｜LUMArch" />
    <meta
      property="og:description"
      content="整理改建、增建、違建與建造執照規定，快速找到你需要的法條。"
    />
    <meta property="og:type" content="website" />

    <link rel="icon" href="../LUMArch.ico" />

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
      integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
      crossorigin="anonymous"
    ></script>
    <script defer src="../js/page-router.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>

    <!-- 結構化資料（SEO加分） -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Blog",
        "name": "建築法規知識庫",
        "description": "整理台灣建築法規與申請流程",
        "publisher": {
          "@type": "Organization",
          "name": "LUMArch"
        }
      }
    </script>
  </head>

  <body class="blog-body">
    <main
      class="blog-page"
      data-page-root="./building-law/"
      x-data="buildingLawIndex"
      x-init="loadArticles()"
    >
      <nav class="blog-nav" aria-label="頁面導覽">
        <a href="../index.html" class="back-link">回到 AI 查詢</a>
        <span>LUMArch 建築法規整理</span>
      </nav>

      <header class="blog-hero">
        <div>
          <p class="blog-kicker">Knowledge Base</p>
          <h1>建築法規知識庫</h1>
          <p class="blog-lead">
            整理改建、增建、違建與建造執照的常見判斷重點，協助你在施工或諮詢前先掌握方向。
          </p>
        </div>
        <a href="../index.html" class="blog-cta">直接用 AI 查法規</a>
      </header>

      <section class="blog-search" aria-label="搜尋知識庫文章">
        <label for="articleSearch">搜尋文章</label>
        <input
          id="articleSearch"
          type="search"
          x-model="query"
          placeholder="輸入關鍵字，例如：違建、容積率、改建"
        />
        <span
          x-show="query"
          x-text="`找到 ${filteredArticles.length} 篇`"
        ></span>
      </section>

      <section class="blog-grid" id="blogList" aria-live="polite">
        <template x-if="loading">
          <article class="blog-card blog-card-muted">
            <div class="blog-tag">Loading</div>
            <h2>讀取文章列表中</h2>
            <p>正在整理建築法規知識庫文章。</p>
          </article>
        </template>

        <template x-if="error">
          <article class="blog-card blog-card-muted">
            <div class="blog-tag">載入失敗</div>
            <h2>無法讀取文章列表</h2>
            <p x-text="error"></p>
          </article>
        </template>

        <template x-if="!loading && !error && filteredArticles.length === 0">
          <article class="blog-card blog-card-muted">
            <div class="blog-tag">沒有結果</div>
            <h2>找不到符合的文章</h2>
            <p>請試試其他關鍵字，或直接使用 AI 查詢更完整的法規脈絡。</p>
          </article>
        </template>

        <template x-for="article in filteredArticles" :key="article.url">
          <article class="blog-card">
            <div class="blog-tag" x-text="article.tag"></div>
            <h2>
              <a
                :href="articleHref(article)"
                :data-main-link="articlePath(article)"
                x-text="article.title"
              ></a>
            </h2>
            <p x-text="article.desc"></p>
          </article>
        </template>
      </section>

      <section class="blog-note">
        <div>
          <p class="blog-kicker">Quick Guide</p>
          <h2>查法規前，可以先確認什麼？</h2>
        </div>
        <p>
          在台灣，建築法規通常會牽涉建造執照、使用執照、土地使用分區、消防與地方自治規定。
          若你的問題和實際基地、建物狀態或施工範圍有關，建議搭配
          <strong>LUMArch AI 查詢工具</strong>
          取得更貼近情境的條文方向。
        </p>
      </section>
    </main>
  </body>
</html>
