<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Featured Research | LUMZone</title>
    <meta property="og:title" content="Featured Research | LUMZone" />
    <meta
      property="og:description"
      content="Citation-grounded California ADU and zoning research."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://lum-zone.com/pages/articles/index.html"
    />
    <meta
      name="description"
      content="Citation-grounded California ADU and zoning research articles from LUMZone."
    />

    <link
      rel="canonical"
      href="https://lum-zone.com/pages/articles/index.html"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Featured Research | LUMZone",
        "description": "Citation-grounded California ADU and zoning research articles from LUMZone.",
        "url": "https://lum-zone.com/pages/articles/index.html"
      }
    </script>
    <style>
      :root {
        --bg: #f6f0e7;
        --ink: #1a1a2e;
        --muted: #746b60;
        --accent: #c8522a;
        --line: #d9ccb7;
        --panel: #fffaf3;
      }

      body {
        min-height: 100vh;
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.46),
            rgba(255, 255, 255, 0)
          ),
          var(--bg);
        color: var(--ink);
        font-family: Inter, system-ui, sans-serif;
      }

      .page-wrap {
        width: min(100%, 1120px);
        margin: 0 auto;
        padding: 34px 24px 72px;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 34px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }

      .back-link:hover {
        color: var(--accent);
      }

      .back-link i {
        font-size: 16px;
      }

      .page-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 32px;
        padding: 42px 0 36px;
        border-bottom: 1px solid var(--line);
      }

      .hero-kicker {
        margin-bottom: 12px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .hero-title {
        max-width: 760px;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(36px, 5.6vw, 62px);
        font-weight: 800;
        letter-spacing: 0;
        line-height: 1.06;
        margin-bottom: 18px;
      }

      .hero-sub {
        max-width: 700px;
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.85;
      }

      .hero-stat {
        display: grid;
        gap: 4px;
        min-width: 170px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 250, 243, 0.72);
      }

      .hero-stat strong {
        color: var(--ink);
        font-size: 28px;
        line-height: 1;
      }

      .hero-stat span {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .article-grid {
        margin-top: 28px;
      }

      .article-search-wrap {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        margin-top: 24px;
      }

      .article-search {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 10px;
        min-height: 48px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fffaf3;
        box-shadow: 0 10px 28px rgba(68, 45, 28, 0.06);
      }

      .article-search i {
        color: var(--accent);
        font-size: 16px;
      }

      .article-search input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--ink);
        font-size: 14px;
      }

      .article-search input::placeholder {
        color: #a69b8e;
      }

      .article-search:focus-within {
        border-color: rgba(200, 82, 42, 0.52);
        box-shadow: 0 0 0 3px rgba(200, 82, 42, 0.1);
      }

      .result-count {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 32px;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 250, 243, 0.72);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }

      .article-card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 18px;
        height: 100%;
        min-height: 280px;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 12px 32px rgba(68, 45, 28, 0.06);
        transition:
          border-color 0.16s ease,
          box-shadow 0.16s ease,
          transform 0.16s ease;
      }

      .article-card:hover {
        transform: translateY(-3px);
        border-color: rgba(200, 82, 42, 0.5);
        box-shadow: 0 16px 38px rgba(68, 45, 28, 0.1);
      }

      .article-tag {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        min-height: 26px;
        padding: 4px 10px;
        border: 1px solid rgba(200, 82, 42, 0.24);
        border-radius: 999px;
        background: #fff3ec;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
      }

      .article-title {
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 25px;
        font-weight: 700;
        line-height: 1.3;
      }

      .article-desc {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.85;
        margin: 0;
      }

      .article-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        width: fit-content;
        margin-top: auto;
        color: var(--ink);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.02em;
        text-decoration: none;
      }

      .article-link:hover {
        color: var(--accent);
      }

      .article-link i {
        font-size: 15px;
        transition: transform 0.16s ease;
      }

      .article-link:hover i {
        transform: translateX(3px);
      }

      .loading-card {
        padding: 24px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        background: rgba(255, 250, 243, 0.6);
      }

      .powered-badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 30px;
        margin-top: 28px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 250, 243, 0.72);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .powered-badge i {
        color: var(--accent);
        font-size: 13px;
      }

      @media (max-width: 760px) {
        .page-wrap {
          padding: 24px 16px 48px;
        }

        .page-header {
          grid-template-columns: 1fr;
          gap: 22px;
          padding: 32px 0 28px;
        }

        .hero-stat {
          min-width: 0;
          width: 100%;
        }

        .article-card {
          min-height: 0;
          padding: 20px;
        }

        .article-search-wrap {
          grid-template-columns: 1fr;
          gap: 10px;
        }
      }
    </style>
  </head>

  <body>
    <div class="page-wrap research-index" data-page-root="./">
      <a href="../../chat.html" class="back-link"> Back to LUMZone </a>

      <header class="page-header">
        <div>
          <h1 class="hero-title">Featured Research</h1>

          <p class="hero-sub">
            Citation-grounded California ADU and zoning research designed for
            homeowners, investors, contractors, and design teams exploring
            feasibility questions.
          </p>
        </div>

        <div class="hero-stat" aria-label="Research count">
          <strong id="articleCount">15+</strong>
          <span>focused zoning guides</span>
        </div>
      </header>

      <div class="article-search-wrap">
        <label class="article-search" for="articleSearch">
          <i class="bi bi-search"></i>
          <input
            id="articleSearch"
            type="search"
            placeholder="Search ADU size, parking, setbacks, garage conversions..."
            autocomplete="off"
          />
        </label>
        <span class="result-count" id="resultCount">Loading</span>
      </div>

      <div class="row g-4 article-grid" id="articleGrid">
        <div class="col-12">
          <div class="loading-card">Loading articles...</div>
        </div>
      </div>

      <div class="powered-badge">
        <i class="bi bi-stars"></i>
        Powered by LUMZone AI
      </div>
    </div>

    <script>
      let allArticles = [];
      let pageRoot = "./";

      function resolveArticlePath(path) {
        return new URL(
          path,
          new URL(pageRoot, window.location.href),
        ).toString();
      }

      function getArticleUrl(article) {
        return resolveArticlePath(article.url);
      }

      function renderArticles(articles) {
        const grid = document.getElementById("articleGrid");
        const resultCount = document.getElementById("resultCount");

        resultCount.textContent =
          articles.length === 1 ? "1 result" : `${articles.length} results`;

        if (!articles.length) {
          grid.innerHTML = `
            <div class="col-12">
              <div class="loading-card">No articles match your search.</div>
            </div>
          `;
          return;
        }

        grid.innerHTML = articles
          .map((a) => {
            const articleUrl = getArticleUrl(a);

            return `
            <div class="col-lg-6">
              <div class="article-card">
                <div class="article-tag">${a.tag}</div>

                <div class="article-title">
                  ${a.title}
                </div>

                <p class="article-desc">
                  ${a.description}
                </p>

                <a href="${articleUrl}" class="article-link">
                  Read Research <i class="bi bi-arrow-right"></i>
                </a>
              </div>
            </div>
          `;
          })
          .join("");
      }

      function filterArticles() {
        const search = document.getElementById("articleSearch");
        const query = search.value.trim().toLowerCase();

        if (!query) {
          renderArticles(allArticles);
          return;
        }

        const filtered = allArticles.filter((article) => {
          return [article.title, article.tag, article.description]
            .join(" ")
            .toLowerCase()
            .includes(query);
        });

        renderArticles(filtered);
      }

      async function loadArticles() {
        const grid = document.getElementById("articleGrid");

        try {
          pageRoot =
            document.querySelector("[data-page-root]")?.dataset.pageRoot ||
            "./";

          const res = await fetch(resolveArticlePath("articles.json"), {
            cache: "no-store",
          });
          if (!res.ok) throw new Error("Failed to load articles.json");

          allArticles = await res.json();
          document.getElementById("articleCount").textContent =
            allArticles.length;
          renderArticles(allArticles);
        } catch (err) {
          console.error(err);
          document.getElementById("resultCount").textContent = "Unavailable";
          grid.innerHTML = `
        <div class="col-12">
          <div class="article-card">
            Could not load articles right now.
          </div>
        </div>
      `;
        }
      }

      document
        .getElementById("articleSearch")
        .addEventListener("input", filterArticles);

      loadArticles();
    </script>
  </body>
</html>
